<div class="anki-app-wrapper">
    <div class="main-card">
        <div id="question-container" class="question-container">{{question}}</div>
        <div id="options-list" class="options-stack"></div>
        <div class="footer-hint">Flip card to see results</div>
    </div>
</div>

<div id="data-store" style="display:none;">
    <div id="ans-val">{{answer}}</div>
    <div id="opt-A">{{optionA}}</div><div id="note-A">{{noteA}}</div>
    <div id="opt-B">{{optionB}}</div><div id="note-B">{{noteB}}</div>
    <div id="opt-C">{{optionC}}</div><div id="note-C">{{noteC}}</div>
    <div id="opt-D">{{optionD}}</div><div id="note-D">{{noteD}}</div>
    <div id="opt-E">{{optionE}}</div><div id="note-E">{{noteE}}</div>
    <div id="opt-F">{{optionF}}</div><div id="note-F">{{noteF}}</div>
</div>

<script>
    var getResources = [
        getCSS("_katex.css", "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css"),
        getCSS("_highlight.css", "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/styles/default.min.css"),
        getScript("_highlight.js", "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/highlight.min.js"),
        getScript("_katex.min.js", "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js"),
        getScript("_auto-render.js", "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/auto-render-cdn.js"),
        getScript("_markdown-it.min.js", "https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.0.4/markdown-it.min.js"),
        getScript("_markdown-it-mark.js","https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/_markdown-it-mark.js")
    ];
    
    Promise.all(getResources)
        .then(() => getScript("_mhchem.js", "https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/mhchem.min.js"))
        .then(initCard)
        .catch(initCard);

    function getScript(path, altURL) {
        return new Promise((resolve, reject) => {
            let script = document.createElement("script");
            script.onload = resolve;
            script.onerror = function() {
                let script_online = document.createElement("script");
                script_online.onload = resolve;
                script_online.onerror = reject;
                script_online.src = altURL;
                document.head.appendChild(script_online);
            }
            script.src = path;
            document.head.appendChild(script);
        })
    }
    
    function getCSS(path, altURL) {
        return new Promise((resolve, reject) => {
            var css = document.createElement('link');
            css.setAttribute('rel', 'stylesheet');
            css.type = 'text/css';
            css.onload = resolve;
            css.onerror = function() {
                var css_online = document.createElement('link');
                css_online.setAttribute('rel', 'stylesheet');
                css_online.type = 'text/css';
                css_online.onload = resolve;
                css_online.onerror = reject;
                css_online.href = altURL;
                document.head.appendChild(css_online);
            }
            css.href = path;
            document.head.appendChild(css);
        });
    }

    function renderMath(ID) {
        let element = document.getElementById(ID);
        if (!element) return;
        let text = element.innerHTML;
        text = replaceInString(text);
        element.textContent = text;
        if (typeof renderMathInElement !== 'undefined') {
            renderMathInElement(element, {
                delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}],
                throwOnError: false
            });
        }
    }
    
    function markdown(ID) {
        let element = document.getElementById(ID);
        if (!element || typeof markdownit === 'undefined') return;
        let md = new markdownit({
            typographer: true, html: true, 
            highlight: function (str, lang) {
                if (lang && typeof hljs !== 'undefined' && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(str, { language: lang }).value; } catch (__) {}
                }
                return '';
            }
        }).use(markdownItMark);
        let text = replaceHTMLElementsInString(element.innerHTML);
        text = md.render(text);
        element.innerHTML = text.replace(/&lt;\/span&gt;/gi,"\\");
    }
    
    function replaceInString(str) {
        str = str.replace(/<[\/]?pre[^>]*>/gi, "");
        str = str.replace(/<br\s*[\/]?[^>]*>/gi, "\n");
        str = str.replace(/<div[^>]*>/gi, "\n");
        str = str.replace(/<[\/]?span[^>]*>/gi, "");
        str = str.replace(/<\/div[^>]*>/g, "\n");
        return replaceHTMLElementsInString(str);
    }
    
    function replaceHTMLElementsInString(str) {
        str = str.replace(/&nbsp;/gi, " ");
        str = str.replace(/&tab;/gi, "    ");
        str = str.replace(/&gt;/gi, ">");
        str = str.replace(/&lt;/gi, "<");
        return str.replace(/&amp;/gi, "&");
    }

    function initCard() {
        renderMath('question-container');
        markdown('question-container');
        
        const list = document.getElementById('options-list');
        list.innerHTML = '';
        
        const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
        const availableLetters = letters.filter(l => document.getElementById('opt-' + l).innerHTML.trim() !== "");
        
        const qText = document.getElementById('question-container').innerText;
        const ansText = document.getElementById('ans-val').innerText;
        const cardID = qText + "::" + ansText;
        
        let shuffled;
        if (window.ankiCardID === cardID && window.ankiShuffledOrder) {
            shuffled = availableLetters.sort((a, b) => {
                return window.ankiShuffledOrder.indexOf(a) - window.ankiShuffledOrder.indexOf(b);
            });
        } else {
            shuffled = availableLetters.sort(() => Math.random() - 0.5);
            window.ankiCardID = cardID;
            window.ankiShuffledOrder = [...shuffled];
        }

        shuffled.forEach((l, i) => {
            const row = document.createElement('div');
            row.className = 'opt-row';
            row.dataset.letter = l;
            
            const letterBox = document.createElement('div');
            letterBox.className = 'letter-box';
            letterBox.innerText = l;
            
            const contentBox = document.createElement('div');
            contentBox.className = 'content-box';
            
            const tempDiv = document.createElement('div');
            tempDiv.id = 'temp-opt-' + l;
            tempDiv.innerHTML = document.getElementById('opt-'+l).innerHTML;
            tempDiv.style.display = 'none';
            document.body.appendChild(tempDiv);
            renderMath('temp-opt-' + l);
            markdown('temp-opt-' + l);
            
            const textBox = document.createElement('div');
            textBox.className = 'opt-text';
            textBox.innerHTML = tempDiv.innerHTML;
            document.body.removeChild(tempDiv);
            
            contentBox.appendChild(textBox);
            
            const statusBox = document.createElement('div');
            statusBox.className = 'status-box'; 

            row.appendChild(letterBox);
            row.appendChild(contentBox);
            row.appendChild(statusBox);

            row.onclick = () => {
                if (document.body.classList.contains('reveal-mode')) return;
                row.classList.toggle('selected');
                if (row.classList.contains('selected')) {
                    sessionStorage.setItem('pick_' + l, 'true');
                } else {
                    sessionStorage.removeItem('pick_' + l);
                }
            };
            list.appendChild(row);
        });

        if (typeof revealAnswers === 'function') {
            setTimeout(revealAnswers, 50); 
        }
    }
</script>
