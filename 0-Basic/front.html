<div class="anki-app-wrapper">
    <div class="main-card content-container" id="front-outer">
        <div id="front-content"></div>
    </div>
</div>

<div id="raw-front" style="display: none">{{Front}}</div>

<script>
    var getResources = [
        getCSS(
            "_katex.css",
            "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css",
        ),
        getCSS(
            "_highlight.css",
            "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/styles/default.min.css",
        ),
        getScript(
            "_highlight.js",
            "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/highlight.min.js",
        ),
        getScript(
            "_katex.min.js",
            "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js",
        ),
        getScript(
            "_auto-render.js",
            "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/auto-render-cdn.js",
        ),
        getScript(
            "_markdown-it.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.0.4/markdown-it.min.js",
        ),
        getScript(
            "_markdown-it-mark.js",
            "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/_markdown-it-mark.js",
        ),
    ];

    function getScript(path, altURL) {
        return new Promise((resolve) => {
            let s = document.createElement("script");
            s.onload = resolve;
            s.onerror = () => {
                let s2 = document.createElement("script");
                s2.onload = resolve;
                s2.onerror = resolve;
                s2.src = altURL;
                document.head.appendChild(s2);
            };
            s.src = path;
            document.head.appendChild(s);
        });
    }
    function getCSS(path, altURL) {
        return new Promise((resolve) => {
            let c = document.createElement("link");
            c.rel = "stylesheet";
            c.onload = resolve;
            c.onerror = () => {
                let c2 = document.createElement("link");
                c2.rel = "stylesheet";
                c2.onload = resolve;
                c2.onerror = resolve;
                c2.href = altURL;
                document.head.appendChild(c2);
            };
            c.href = path;
            document.head.appendChild(c);
        });
    }

    function cleanAnkiHTML(html) {
        return html
            .replace(/<br\s*[\/]?>/gi, "\n")
            .replace(/<div[^>]*>/gi, "\n")
            .replace(/<\/div[^>]*>/g, "\n")
            .replace(/&nbsp;/gi, " ")
            .replace(/&gt;/gi, ">")
            .replace(/&lt;/gi, "<")
            .replace(/&amp;/gi, "&")
            .trim();
    }

    function render() {
        const source = document.getElementById("raw-front");
        const target = document.getElementById("front-content");
        if (!source || !target) return;

        const md = new markdownit({
            html: true,
            typographer: true,
            highlight: (str, lang) => {
                if (
                    lang &&
                    typeof hljs !== "undefined" &&
                    hljs.getLanguage(lang)
                ) {
                    try {
                        return hljs.highlight(str, { language: lang }).value;
                    } catch (__) {}
                }
                return "";
            },
        }).use(markdownItMark);

        target.innerHTML = md.render(cleanAnkiHTML(source.innerHTML));

        /*
         * FIX: Android/mobile table overflow (columns cut off on right side)
         *
         * ISSUE: Anki's Android WebView does not reliably honour `overflow-x: auto`
         * or `display: block` set directly on a <table> element via CSS. As a result,
         * wide tables bleed off the right edge of the card with no way to scroll.
         *
         * FIX: After markdown renders the HTML, we use JavaScript to physically wrap
         * every <table> in a new <div class="table-scroll-wrapper">. Because this div
         * is a normal block element (not a table), `overflow-x: auto` works on it
         * without any WebView quirks — the table scrolls horizontally inside it when
         * it is wider than the card. This approach is more robust than a pure CSS fix
         * because it does not depend on the browser respecting non-standard display
         * values on table elements.
         */
        target.querySelectorAll("table").forEach(function (table) {
            var wrapper = document.createElement("div");
            wrapper.className = "table-scroll-wrapper";
            table.parentNode.insertBefore(wrapper, table);
            wrapper.appendChild(table);
        });

        if (
            typeof renderMathInElement !== "undefined" &&
            target.textContent.includes("$")
        ) {
            renderMathInElement(target, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false },
                ],
                throwOnError: false,
            });
        }
    }

    Promise.all(getResources)
        .then(() => {
            return getScript(
                "_mhchem.js",
                "https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/mhchem.min.js",
            );
        })
        .then(render)
        .catch(render);
</script>
