<div class="anki-app-wrapper">
    <div class="main-card ordering-container">
        <div class="instruction-banner">
            Click an item, then another to <b>SWAP</b>. <br />
            Click an item, then the <b>BOX</b> (Left=First / Right=Last) to move
            it.
        </div>

        <div id="sequence-zone" class="sequence-box">
            <div class="placeholder-text">Sequence Area</div>
        </div>

        <div id="item-pool" class="item-pool"></div>
    </div>
</div>

<div id="raw-data" style="display: none">{{order}}</div>

<script>
    var getResources = [
        getCSS(
            "_katex.css",
            "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css",
        ),
        getCSS(
            "_highlight.css",
            "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/styles/default.min.css",
        ),
        getScript(
            "_highlight.js",
            "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/highlight.min.js",
        ),
        getScript(
            "_katex.min.js",
            "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js",
        ),
        getScript(
            "_auto-render.js",
            "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/auto-render-cdn.js",
        ),
        getScript(
            "_markdown-it.min.js",
            "https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.0.4/markdown-it.min.js",
        ),
        getScript(
            "_markdown-it-mark.js",
            "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/_markdown-it-mark.js",
        ),
    ];

    Promise.all(getResources)
        .then(() => {
            return getScript(
                "_mhchem.js",
                "https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/mhchem.min.js",
            );
        })
        .then(initOrdering)
        .catch(initOrdering);

    function getScript(path, altURL) {
        return new Promise((resolve) => {
            let s = document.createElement("script");
            s.onload = resolve;
            s.onerror = () => {
                let s2 = document.createElement("script");
                s2.src = altURL;
                s2.onload = resolve;
                document.head.appendChild(s2);
            };
            s.src = path;
            document.head.appendChild(s);
        });
    }
    function getCSS(path, altURL) {
        return new Promise((resolve) => {
            let c = document.createElement("link");
            c.rel = "stylesheet";
            c.href = path;
            c.onerror = () => {
                let c2 = document.createElement("link");
                c2.rel = "stylesheet";
                c2.href = altURL;
                document.head.appendChild(c2);
            };
            document.head.appendChild(c);
            resolve();
        });
    }

    function cleanAnkiHTML(html) {
        return html
            .replace(/<br\s*[\/]?>/gi, "\n")
            .replace(/<div[^>]*>/gi, "\n")
            .replace(/<\/div[^>]*>/g, "\n")
            .replace(/&nbsp;/gi, " ")
            .replace(/&gt;/gi, ">")
            .replace(/&lt;/gi, "<")
            .replace(/&amp;/gi, "&")
            .trim();
    }

    function renderMarkdown(target, rawText) {
        const md = new markdownit({
            html: true,
            typographer: true,
            highlight: (str, lang) => {
                if (
                    lang &&
                    typeof hljs !== "undefined" &&
                    hljs.getLanguage(lang)
                ) {
                    try {
                        return hljs.highlight(str, { language: lang }).value;
                    } catch (__) {}
                }
                return "";
            },
        }).use(markdownItMark);
        target.innerHTML = md.render(rawText);
        if (typeof renderMathInElement !== "undefined" && target.textContent.includes('$')) {
            renderMathInElement(target, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false },
                ],
                throwOnError: false,
            });
        }
    }

    let selectedChip = null;
    let cardUniqueId = "";

    function initOrdering() {
        const raw = cleanAnkiHTML(
            document.getElementById("raw-data").innerHTML,
        );
        const items = raw
            .split(/==\*==|\n/)
            .map((i) => i.trim())
            .filter((i) => i);
        const pool = document.getElementById("item-pool");
        const zone = document.getElementById("sequence-zone");

        cardUniqueId = btoa(unescape(encodeURIComponent(raw))).substring(0, 16);

        items.forEach((content, idx) => {
            const chip = document.createElement("div");
            chip.className = "order-chip";
            chip.id = `item-${idx}`;
            renderMarkdown(chip, content);
            chip.onclick = (e) => {
                e.stopPropagation();
                handleChipClick(chip);
            };
            pool.appendChild(chip);
        });

        for (let i = pool.children.length; i >= 0; i--) {
            pool.appendChild(pool.children[(Math.random() * i) | 0]);
        }

        zone.onclick = (e) => {
            if (selectedChip) {
                if (e.offsetX < zone.clientWidth / 2) zone.prepend(selectedChip);
                else zone.appendChild(selectedChip);
                updateUIState();
            }
        };
    }

    function handleChipClick(chip) {
        if (!selectedChip) {
            selectedChip = chip;
            chip.classList.add("selected");
        } else if (selectedChip === chip) {
            deselect();
        } else {
            const dummy = document.createElement("div");
            selectedChip.before(dummy);
            chip.before(selectedChip);
            dummy.replaceWith(chip);
            updateUIState();
        }
    }

    function updateUIState() {
        const zone = document.getElementById("sequence-zone");
        const placeholder = zone.querySelector(".placeholder-text");
        const chipsInZone = zone.querySelectorAll(".order-chip");
        if (placeholder)
            placeholder.style.display =
                chipsInZone.length > 0 ? "none" : "block";
        deselect();
        saveState();
    }

    function deselect() {
        if (selectedChip) selectedChip.classList.remove("selected");
        selectedChip = null;
    }
    function saveState() {
        const orderIds = Array.from(
            document
                .getElementById("sequence-zone")
                .querySelectorAll(".order-chip"),
        ).map((c) => c.id);
        sessionStorage.setItem(
            "order_" + cardUniqueId,
            JSON.stringify(orderIds),
        );
    }
</script>
