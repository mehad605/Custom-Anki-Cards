<div class="anki-app-wrapper">
    <div class="main-card ordering-container">
        <div class="instruction-banner result-banner">REVEALED ORDER</div>

        <div class="result-section">
            <h6 class="label">YOUR ATTEMPT</h6>
            <div id="user-sequence" class="sequence-box results"></div>
        </div>

        <div class="result-section">
            <h6 class="label">CORRECT ORDER</h6>
            <div id="correct-sequence" class="sequence-box results"></div>
        </div>

        {{#note}}
        <div id="note-wrapper" class="note-box">
            <div class="note-label">NOTE</div>
            <div id="note-content"></div>
        </div>
        <div id="raw-note" style="display: none">{{note}}</div>
        {{/note}}
    </div>
</div>

<div id="raw-data" style="display: none">{{order}}</div>

<script>
    var getResources = [
        getCSS("_katex.css", "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css"),
        getCSS("_highlight.css", "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/styles/default.min.css"),
        getScript("_highlight.js", "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/highlight.min.js"),
        getScript("_katex.min.js", "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js"),
        getScript("_auto-render.js", "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/auto-render-cdn.js"),
        getScript("_markdown-it.min.js", "https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.0.4/markdown-it.min.js"),
        getScript("_markdown-it-mark.js", "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/_markdown-it-mark.js"),
    ];

    function getScript(path, altURL) {
        return new Promise((resolve) => {
            let s = document.createElement("script");
            s.onload = resolve;
            s.onerror = () => {
                let s2 = document.createElement("script");
                s2.src = altURL;
                s2.onload = resolve;
                document.head.appendChild(s2);
            };
            s.src = path;
            document.head.appendChild(s);
        });
    }
    function getCSS(path, altURL) {
        return new Promise((resolve) => {
            let c = document.createElement("link");
            c.rel = "stylesheet";
            c.href = path;
            c.onerror = () => {
                let c2 = document.createElement("link");
                c2.rel = "stylesheet";
                c2.href = altURL;
                document.head.appendChild(c2);
            };
            document.head.appendChild(c);
            resolve();
        });
    }

    function cleanAnkiHTML(html) {
        return html
            .replace(/<br\s*[\/]?>/gi, "\n")
            .replace(/<div[^>]*>/gi, "\n")
            .replace(/<\/div[^>]*>/g, "\n")
            .replace(/&nbsp;/gi, " ")
            .replace(/&gt;/gi, ">")
            .replace(/&lt;/gi, "<")
            .replace(/&amp;/gi, "&")
            .trim();
    }

    function renderMarkdown(target, rawText) {
        const md = new markdownit({
            html: true,
            typographer: true,
            highlight: (str, lang) => {
                if (
                    lang &&
                    typeof hljs !== "undefined" &&
                    hljs.getLanguage(lang)
                ) {
                    try {
                        return hljs.highlight(str, { language: lang }).value;
                    } catch (__) {}
                }
                return "";
            },
        }).use(markdownItMark);
        target.innerHTML = md.render(rawText);
        if (typeof renderMathInElement !== "undefined" && target.textContent.includes('$')) {
            renderMathInElement(target, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false },
                ],
                throwOnError: false,
            });
        }
    }

    function revealResults() {
        const raw = cleanAnkiHTML(
            document.getElementById("raw-data").innerHTML,
        );
        const items = raw
            .split(/==\*==|\n/)
            .map((i) => i.trim())
            .filter((i) => i);
        const cardId = btoa(unescape(encodeURIComponent(raw))).substring(0, 16);
        const userState = JSON.parse(
            sessionStorage.getItem("order_" + cardId) || "[]",
        );

        const userContainer = document.getElementById("user-sequence");
        const correctContainer = document.getElementById("correct-sequence");

        items.forEach((content) => {
            const chip = document.createElement("div");
            chip.className = "order-chip state-correct";
            renderMarkdown(chip, content);
            correctContainer.appendChild(chip);
        });

        userState.forEach((id, index) => {
            const originalIdx = parseInt(id.split("-")[1]);
            const isCorrect = originalIdx === index;
            const chip = document.createElement("div");
            chip.className = `order-chip ${isCorrect ? "state-correct" : "state-wrong"}`;
            renderMarkdown(chip, items[originalIdx]);
            userContainer.appendChild(chip);
        });

        if (userState.length === 0)
            userContainer.innerHTML =
                "<div class='missed-text'>No items placed.</div>";

        // Render Note
        const rawNote = document.getElementById("raw-note");
        const noteTarget = document.getElementById("note-content");
        if (rawNote && noteTarget)
            renderMarkdown(noteTarget, cleanAnkiHTML(rawNote.innerHTML));

        sessionStorage.removeItem("order_" + cardId);
    }

    Promise.all(getResources)
        .then(() => {
            return getScript(
                "_mhchem.js",
                "https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/mhchem.min.js",
            );
        })
        .then(revealResults)
        .catch(revealResults);
</script>
