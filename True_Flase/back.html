<div class="reveal-mode"></div>
{{FrontSide}}

<script>
    document.body.classList.add('reveal-mode');

    function revealResults() {
        const rows = document.querySelectorAll('.tf-row');
        const dataMap = {};
        document.querySelectorAll('.tf-data').forEach(el => {
            const match = cleanAnkiHTML(el.innerHTML).match(/^\s*==([TF])==/i);
            if(match) dataMap[el.dataset.idx] = { truth: match[1].toUpperCase(), note: el.dataset.note };
        });

        rows.forEach(row => {
            const data = dataMap[row.dataset.idx];
            const userPick = sessionStorage.getItem(`tf_pick_${row.dataset.idx}`);
            const isCorrect = (userPick === 'T' && data.truth === 'T') || (userPick === 'F' && data.truth === 'F');

            row.classList.add(isCorrect ? 'tf-correct' : 'tf-wrong');
            if(!isCorrect) row.querySelector(data.truth === 'T' ? '.btn-check' : '.btn-cross').classList.add('should-be');

            if (data.note && data.note.trim() !== "") {
                const noteDiv = document.createElement('div');
                noteDiv.className = 'inline-note';
                noteDiv.innerHTML = `<span class="note-label">NOTE:</span> <div class="note-body">${data.note}</div>`;
                row.querySelector('.tf-content').appendChild(noteDiv);
                // CRITICAL: Call markdown on the body of the note
                markdown(noteDiv.querySelector('.note-body'));
            }
            sessionStorage.removeItem(`tf_pick_${row.dataset.idx}`);
        });
    }
</script>
