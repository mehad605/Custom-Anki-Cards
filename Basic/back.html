<div class="anki-app-wrapper">
    <div class="main-card content-container" id="front-outer">
        <div id="front-content"></div>
    </div>
    
    <div class="separator"></div>
    
    <div class="main-card content-container back-container" id="back-outer">
        <div id="back-content"></div>
    </div>
</div>

<div id="raw-front" style="display:none;">{{Front}}</div>
<div id="raw-back" style="display:none;">{{Back}}</div>

<script>
    // Copy the exact script helper functions (getScript, getCSS, cleanAnkiHTML) from the Front here.

    function render() {
        ['front', 'back'].forEach(part => {
            const source = document.getElementById(`raw-${part}`);
            const target = document.getElementById(`${part}-content`);
            if(!source || !target) return;

            const md = new markdownit({ 
                html: true, typographer: true,
                highlight: (str, lang) => {
                    if (lang && typeof hljs !== 'undefined' && hljs.getLanguage(lang)) {
                        try { return hljs.highlight(str, { language: lang }).value; } catch (__) {}
                    }
                    return '';
                }
            }).use(markdownItMark);

            target.innerHTML = md.render(cleanAnkiHTML(source.innerHTML));
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(target, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false });
            }
        });
    }

    Promise.all(getResources).then(() => {
        return getScript("_mhchem.js", "https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/mhchem.min.js");
    }).then(render).catch(render);
</script>
