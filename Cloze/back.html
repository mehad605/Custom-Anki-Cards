<div class="anki-app-wrapper">
    <div class="main-card content-container" id="back-outer">
        <div id="back-content"></div>
    </div>
    
    <div class="separator"></div>
    
    <div class="main-card content-container extra-container" id="extra-outer">
        <div id="extra-content"></div>
    </div>
</div>

<div id="raw-back" style="display:none;">{{cloze:Text}}</div>
<div id="raw-extra" style="display:none;">{{Back Extra}}</div>

<script>
    // Include same getScript, getCSS, and cleanAnkiHTML helpers from Front

    function renderBack() {
        ['back', 'extra'].forEach(part => {
            const source = document.getElementById(`raw-${part}`);
            const target = document.getElementById(`${part}-content`);
            if(!source || !target) return;

            let rawText = cleanAnkiHTML(source.innerHTML);
            let clozes = [];
            let protectedText = rawText.replace(/<span class="cloze[^>]*>[\s\S]*?<\/span>/g, function(match) {
                clozes.push(match);
                return "CLOZETOKEN" + (clozes.length - 1) + "ENDTOKEN";
            });

            const md = new markdownit({ 
                html: true, highlight: (str, lang) => {
                    if (lang && typeof hljs !== 'undefined' && hljs.getLanguage(lang)) {
                        try { return hljs.highlight(str, { language: lang }).value; } catch (__) {}
                    }
                    return '';
                }
            }).use(markdownItMark);

            target.innerHTML = md.render(protectedText).replace(/CLOZETOKEN(\d+)ENDTOKEN/g, (m, i) => clozes[parseInt(i)]);
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(target, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false });
            }
        });
    }

    Promise.all(getResources).then(() => getScript("_mhchem.js", "https://cdn.jsdelivr.net/npm/katex@0.13.11/dist/contrib/mhchem.min.js")).then(renderBack).catch(renderBack);
</script>
