<div class="reveal-mode"></div>

{{FrontSide}}

<div
    id="detached-answer-container"
    class="main-card answer-card-spaced"
    style="display: none"
>
    <div class="opt-row answer-row">
        <div class="letter-box">ANS</div>
        <div class="content-box">
            <div class="summary-grid">
                <div class="summary-col">
                    <div class="summary-header">YOU CHOSE</div>
                    <div id="user-picks" class="summary-values">-</div>
                </div>
                <div class="summary-col">
                    <div class="summary-header">ACTUAL ANSWER</div>
                    <div id="actual-answers" class="summary-values">-</div>
                </div>
            </div>

            <div
                id="main-note-wrapper"
                class="inline-note"
                style="display: none; margin-top: 15px"
            >
                <span class="note-label">NOTE:</span>
                <span id="main-note-text">{{note}}</span>
            </div>
        </div>
        <div class="status-box"></div>
    </div>
</div>

<script>
    document.body.classList.add("reveal-mode");

    const wrapper = document.querySelector(".anki-app-wrapper");
    const ansContainer = document.getElementById("detached-answer-container");

    if (wrapper && ansContainer) {
        wrapper.appendChild(ansContainer);
        ansContainer.style.display = "block";
    }

    function revealAnswers() {
        const correctAns = document
            .getElementById("ans-val")
            .innerText.trim()
            .toUpperCase()
            .split("");
        const rows = Array.from(document.querySelectorAll(".opt-row"));
        const optionRows = rows.filter(
            (r) => !r.closest(".answer-card-spaced"),
        );

        if (optionRows.length === 0) return;

        let selectedLetters = [];
        optionRows.forEach((row) => {
            const l = row.dataset.letter;
            if (sessionStorage.getItem("pick_" + l) === "true") {
                selectedLetters.push(l);
            }
        });

        ["A", "B", "C", "D", "E", "F"].forEach((l) =>
            sessionStorage.removeItem("pick_" + l),
        );

        optionRows.forEach((row) => {
            const l = row.dataset.letter;
            const isCorrect = correctAns.includes(l);
            const isPicked = selectedLetters.includes(l);

            const statusBox = row.querySelector(".status-box");
            const contentBox = row.querySelector(".content-box");

            row.classList.remove(
                "state-correct",
                "state-wrong",
                "state-missed",
            );

            if (isPicked && isCorrect) {
                row.classList.add("state-correct");
                statusBox.innerHTML = `<span class="v-text">CORRECT</span>`;
            } else if (isPicked && !isCorrect) {
                row.classList.add("state-wrong");
                statusBox.innerHTML = `<span class="v-text">WRONG</span>`;
            } else if (!isPicked && isCorrect) {
                row.classList.add("state-missed");
                statusBox.innerHTML = `<span class="v-text">MISSED</span>`;
            } else {
                statusBox.innerHTML = "";
            }

            const noteSource = document.getElementById("note-" + l);
            const noteContent = noteSource ? noteSource.innerHTML.trim() : "";

            if (noteContent && !row.querySelector(".inline-note")) {
                const n = document.createElement("div");
                n.className = "inline-note";
                n.id = "inline-note-" + l;
                n.innerHTML = `<span class="note-label">NOTE:</span> <span id="note-md-${l}">${noteContent}</span>`;
                contentBox.appendChild(n);

                const noteInner = document.getElementById(`note-md-${l}`);
                if (noteInner) {
                    renderMath(`note-md-${l}`);
                    markdown(`note-md-${l}`);
                }
            }
        });

        const picksHtml = selectedLetters.length
            ? selectedLetters
                  .sort()
                  .map(
                      (s) =>
                          `<span class="${correctAns.includes(s) ? "txt-green" : "txt-red"}">${s}</span>`,
                  )
                  .join(" ")
            : '<span class="txt-orange">-</span>';
        const targetHtml = correctAns
            .sort()
            .map((c) => `<span class="txt-green">${c}</span>`)
            .join(" ");

        document.getElementById("user-picks").innerHTML = picksHtml;
        document.getElementById("actual-answers").innerHTML = targetHtml;

        const mainNoteText = document.getElementById("main-note-text");
        if (mainNoteText && mainNoteText.innerHTML.trim() !== "") {
            document.getElementById("main-note-wrapper").style.display =
                "block";
            renderMath("main-note-text");
            markdown("main-note-text");
        }
    }
</script>
